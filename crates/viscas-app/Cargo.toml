[package]
name = "viscas-app"
description = "GTK4 desktop shell for Viscas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "viscas"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.22", features = ["pdf", "ps", "png"] }
gtk4 = { workspace = true, features = ["v4_14"] }
pangocairo.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
viscas-core.workspace = true
viscas-engine.workspace = true
viscas-plot.workspace = true
viscas-scene.workspace = true

