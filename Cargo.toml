[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnCarsenat/viscas"

[workspace.dependencies]
viscas-core = { path = "crates/viscas-core" }
viscas-scene = { path = "crates/viscas-scene" }
viscas-plot = { path = "crates/viscas-plot" }
viscas-script = { path = "crates/viscas-script" }
gtk4 = "0.11.5"
